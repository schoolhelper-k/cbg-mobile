<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0284c7">
  <meta name="robots" content="noindex">
  <title>창원북면고 업무도우미</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <img src="icon.png" alt="" class="logo">
    <div class="top-title"><strong>창원북면고 업무도우미</strong><span id="who"></span></div>
    <button id="logout" class="ghost" hidden>로그아웃</button>
  </header>

  <main>
    <form id="login" class="card" hidden>
      <h1>휴대폰으로 보기</h1>
      <p class="muted">교직원 명렬에 등록된 이름과 학교에서 안내한 휴대폰 비밀번호를 넣어 주세요. 한 번 로그인하면 72시간 유지됩니다.</p>
      <label>이름<input id="name" autocomplete="name" required maxlength="30" placeholder="예: 홍길동"></label>
      <label>휴대폰 비밀번호<input id="password" type="password" autocomplete="current-password" required></label>
      <button type="submit" class="primary">로그인</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>

    <section id="app" hidden>
      <div class="datebar">
        <button class="ghost" data-move="-1" aria-label="전날">‹</button>
        <input type="date" id="date">
        <button class="ghost" data-move="1" aria-label="다음 날">›</button>
        <button class="ghost" id="today">오늘</button>
        <button class="ghost" id="refresh" aria-label="새로고침">↻</button>
      </div>
      <p id="status" class="muted small" role="status"></p>
      <div id="panel"></div>
    </section>
  </main>

  <nav id="tabs" class="tabs" hidden>
    <button data-tab="schedule" class="on">일정</button>
    <button data-tab="timetable">시간표</button>
    <button data-tab="meals">급식</button>
    <button data-tab="tasks">업무·공지</button>
  </nav>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
